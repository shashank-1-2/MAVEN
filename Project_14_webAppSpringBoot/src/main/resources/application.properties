spring.application.name=webApp


# Sets a fixed database URL (otherwise Spring Boot generates a random string every restart)
spring.datasource.url=jdbc:h2:mem:testdb

# Prints the SQL queries generated by Hibernate directly into your terminal
spring.jpa.show-sql=true

# Automatically creates or updates your database tables based on your Java @Entity classes
spring.jpa.hibernate.ddl-auto=update

# Disables the open-in-view warning currently showing in your terminal
spring.jpa.open-in-view=false

# Enables the H2 web interface so you can view your database in a browser
spring.h2.console.enabled=true

spring.datasource.driver-class-name=org.h2.Driver

