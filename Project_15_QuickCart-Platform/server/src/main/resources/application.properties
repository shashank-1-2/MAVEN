spring.application.name=quickcart-server

server.port=8080

# PostgreSQL Settings (replace with your credentials)
spring.datasource.url=jdbc:postgresql://localhost:5432/quickcart_db
spring.datasource.username=postgres
spring.datasource.password=your_password

# Hibernate Auto-schema updates
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true