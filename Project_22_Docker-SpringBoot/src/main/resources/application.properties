spring.config.import=optional:application-local.properties

# Server Configuration
server.port=8080

# Application Name
spring.application.name=Docker-SpringBoot

# MySQL DataSource Configuration (Targeting the Docker MySQL service)
spring.datasource.url=jdbc:mysql://mysqldb:3306/university?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false